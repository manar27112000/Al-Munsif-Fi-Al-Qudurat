plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.almunsif.qudurat'
    compileSdk 35

    defaultConfig {
        applicationId "com.almunsif.qudurat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.12"
            buildPython "python3"
            pip {
                // مكتبات بايثون صافية؛ pyaes متضمنة جوه المشروع (src/main/python/pyaes)
                options "--no-deps"
                install "telethon==1.45.0"
                install "rsa==4.9.1"
                install "pyasn1==0.6.4"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
